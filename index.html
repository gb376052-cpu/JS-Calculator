<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Multi-Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;450;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="calculator-container">
        <!-- Top Bar -->
        <div class="top-controls">
            <select id="modeSelector">
                <option value="standard">Standard</option>
                <option value="scientific">Scientific</option>
                <option value="tip">Tip & Split</option>
                <option value="bmi">BMI Calculator</option>
            </select>
            <button id="themeToggle">🌙</button>
        </div>

        <!-- Display Screen -->
        <div class="display-screen">
            <div id="historyPreview"></div>
            <input type="text" id="mainDisplay" readonly value="0">
        </div>

        <!-- STANDARD CALCULATOR PANEL -->
        <div class="calculator-panel active" id="standardPanel">
            <div class="keypad">
                <button class="btn action" data-value="C">C</button>
                <button class="btn action" data-value="DEL">⌫</button>
                <button class="btn operator" data-value="%">%</button>
                <button class="btn operator" data-value="/">÷</button>
                
                <button class="btn" data-value="7">7</button>
                <button class="btn" data-value="8">8</button>
                <button class="btn" data-value="9">9</button>
                <button class="btn operator" data-value="*">×</button>
                
                <button class="btn" data-value="4">4</button>
                <button class="btn" data-value="5">5</button>
                <button class="btn" data-value="6">6</button>
                <button class="btn operator" data-value="-">-</button>
                
                <button class="btn" data-value="1">1</button>
                <button class="btn" data-value="2">2</button>
                <button class="btn" data-value="3">3</button>
                <button class="btn operator" data-value="+">+</button>
                
                <button class="btn" data-value="0">0</button>
                <button class="btn" data-value=".">.</button>
                <button class="btn equal" data-value="=">=</button> <!-- Ab ye . ke bagal mein aayega -->
            </div>
        </div>

        <!-- SCIENTIFIC CALCULATOR PANEL -->
        <div class="calculator-panel" id="scientificPanel">
            <div class="keypad">
                <button class="btn action" data-value="C">C</button>
                <button class="btn action" data-value="DEL">⌫</button>
                <button class="btn operator" data-value="(">(</button>
                <button class="btn operator" data-value=")">)</button>

                <button class="btn operator" data-value="sin(">sin</button>
                <button class="btn operator" data-value="cos(">cos</button>
                <button class="btn operator" data-value="tan(">tan</button>
                <button class="btn operator" data-value="sqrt(">√</button>

                <button class="btn operator" data-value="log(">log</button>
                <button class="btn operator" data-value="pi">π</button>
                <button class="btn operator" data-value="**">x^y</button>
                <button class="btn operator" data-value="/">÷</button>
                
                <button class="btn" data-value="7">7</button>
                <button class="btn" data-value="8">8</button>
                <button class="btn" data-value="9">9</button>
                <button class="btn operator" data-value="*">×</button>
                
                <button class="btn" data-value="4">4</button>
                <button class="btn" data-value="5">5</button>
                <button class="btn" data-value="6">6</button>
                <button class="btn operator" data-value="-">-</button>
                
                <button class="btn" data-value="1">1</button>
                <button class="btn" data-value="2">2</button>
                <button class="btn" data-value="3">3</button>
                <button class="btn operator" data-value="+">+</button>
                
                <button class="btn" data-value="0">0</button>
                <button class="btn" data-value=".">.</button>
                <button class="btn equal" data-value="=">=</button>
            </div>
        </div>

        <!-- TIP & SPLIT PANEL -->
        <div class="calculator-panel" id="tipPanel">
            <div class="extra-tool-box">
                <label>Bill Amount (₹): <input type="number" id="billAmount" placeholder="Enter amount"></label>
                <label>Tip Percentage (%): <input type="number" id="tipPercent" value="10"></label>
                <label>Number of People: <input type="number" id="splitCount" value="1"></label>
                <div class="result-box">
                    <p>Tip: <span id="tipResult">₹0.00</span></p>
                    <p>Total Per Person: <span id="totalPerPerson">₹0.00</span></p>
                </div>
            </div>
        </div>

        <!-- BMI PANEL -->
        <div class="calculator-panel" id="bmiPanel">
            <div class="extra-tool-box">
                <label>Weight (kg): <input type="number" id="bmiWeight" placeholder="e.g., 65"></label>
                <label>Height (cm): <input type="number" id="bmiHeight" placeholder="e.g., 170"></label>
                <button id="calcBmiBtn" class="btn equal" style="width:100%; margin-top:10px;">Calculate BMI</button>
                <div class="result-box">
                    <p>Your BMI: <span id="bmiResult">0.0</span></p>
                    <p>Status: <span id="bmiStatus">--</span></p>
                </div>
            </div>
        </div>
        
        <button id="toggleHistoryBtn">📜 View History</button>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="history-modal">
        <div class="history-content">
            <h3>Calculation History</h3>
            <ul id="historyList"></ul>
            <button id="clearHistory" class="btn action">Clear History</button>
            <button id="closeHistory" class="btn action">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
